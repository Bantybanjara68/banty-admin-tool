<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>⚡ BANTY ADMIN PANEL</title>
<style>
:root{--bg:#05080d;--panel:#0e1522;--panel2:#09101b;--line:#263653;--text:#f4f7ff;--muted:#aeb9cf;--green:#20e6a8;--green2:#0b604e;--red:#7b2937;--blue:#24334f}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 20% 0,#06352c 0,#05080d 34%,#020408 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{border:0;cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:18px}.top{position:sticky;top:0;z-index:10;background:rgba(5,8,13,.92);backdrop-filter:blur(14px);border-bottom:1px solid #1d293e}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:24px;letter-spacing:1px}.brand span{color:#ffd800;text-shadow:0 0 22px #ffd800}.status{padding:10px 16px;border-radius:30px;background:#063d32;color:#4ff1c3}.card{background:linear-gradient(145deg,#111a2a,#0a111d);border:1px solid var(--line);border-radius:26px;padding:24px;margin:18px 0;box-shadow:0 18px 60px rgba(0,0,0,.25)}.hero{padding:34px 26px}.hero h1{font-size:clamp(38px,8vw,72px);line-height:.98;margin:0 0 14px}.hero p{color:var(--muted);font-size:18px}.tabs{display:flex;gap:10px;overflow:auto;padding:8px 0 12px}.tabs button{white-space:nowrap;background:#17243a;color:#fff;border:1px solid #243657;padding:14px 22px;border-radius:18px;font-weight:800}.tabs button.active,.btn.primary{background:var(--green);color:#00140e}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:22px;border-radius:22px;background:#080f19;border:1px solid #22314c}.stat small{color:var(--muted)}.stat strong{display:block;font-size:38px;margin-top:8px}.hidden{display:none!important}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.btn{padding:14px 20px;border-radius:16px;background:var(--blue);color:#fff;font-weight:800}.btn.danger{background:#642634}.btn.ghost{background:transparent;border:1px solid var(--line)}input,select{width:100%;background:#070d16;color:#fff;border:1px solid #2b3a56;border-radius:16px;padding:15px 16px;outline:none}input:focus,select:focus{border-color:var(--green)}label{display:block;color:var(--muted);margin:14px 0 7px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.product{display:flex;flex-direction:column;justify-content:space-between}.product h3{margin:0 0 8px}.price{font-size:32px;font-weight:900;margin:12px 0}.pill{display:inline-block;padding:7px 11px;border-radius:20px;background:#0a3e35;color:#61f3c7;font-size:13px}.notice{padding:16px;border-radius:18px;background:#111d30;color:#c7d1e5;border:1px solid #243653}.list{display:grid;gap:10px}.item{padding:16px;border:1px solid #22314b;background:#080f19;border-radius:18px}.item b{display:block;margin-bottom:5px}.login{max-width:560px;margin:45px auto}.google{background:#fff;color:#111}.footer{text-align:center;color:#77849c;padding:30px 10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px;z-index:30}.modalbox{width:min(520px,100%);background:#0e1522;border:1px solid #2a3b5b;border-radius:24px;padding:24px}.toast{position:fixed;right:16px;bottom:18px;z-index:50;background:#102338;border:1px solid #2b4365;padding:14px 17px;border-radius:14px;display:none}.admin-badge{color:#ffcf4a}.dangerText{color:#ff8e9d}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.products,.two{grid-template-columns:1fr}.wrap{padding:12px}.card{padding:18px}.brand{font-size:20px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/*
  BANTY ADMIN PANEL
  ---------------------------------------------------------
  IMPORTANT:
  This GitHub Pages file is a FRONTEND.
  Real Google login + real money + verified delivery require
  a secure backend. Never put Razorpay secret keys, Firebase
  admin keys, Telegram bot tokens or database secrets here.

  Configure the backend endpoints below when you have them.
*/
const CONFIG = {
  apiBase: "", // Example: "https://api.example.com"
  telegramUpdates: "https://t.me/YOUR_UPDATE_CHANNEL",
  telegramFeedback: "https://t.me/YOUR_FEEDBACK_CHANNEL",
  googleLoginEndpoint: "/auth/google",
  createOrderEndpoint: "/payments/create-order",
  verifyPaymentEndpoint: "/payments/verify",
  myFilesEndpoint: "/me/files",
  generateKeyEndpoint: "/keys/generate"
};

const demo = {
  products: [
    {id:"p1",name:"BANTY MIUI FILE",desc:"MIUI tool/file package",price:99,available:true}
  ],
  users:["admin"],
  purchases:[],
  keys:[],
  settings:{title:"⚡ BANTY ADMIN PANEL",tool:"BROTHERS TOOL",status:"ON",rgb:"ON",maintenance:"OFF"}
};

function load(){
  try{
    const x=JSON.parse(localStorage.getItem("banty_demo"));
    return x || structuredClone(demo);
  }catch(e){return structuredClone(demo)}
}
let db=load();
function save(){localStorage.setItem("banty_demo",JSON.stringify(db))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display="none",2600)}
function isLogged(){return sessionStorage.getItem("banty_user")}
function user(){return sessionStorage.getItem("banty_user")}

function shell(content){
 return `<header class="top"><div class="wrap bar"><div class="brand"><span>⚡</span> BANTY ADMIN PANEL</div><div class="status">● ONLINE</div></div></header>
 <main class="wrap">${content}</main><footer class="footer">BANTY • Secure digital delivery architecture • V1</footer>`;
}
function nav(active){
 return `<div class="tabs">
  ${["dashboard","files","keys","users","settings"].map(x=>`<button class="${active===x?"active":""}" onclick="go('${x}')">${({dashboard:"Dashboard",files:"Files / Products",keys:"License Keys",users:"Users",settings:"Tool Settings"})[x]}</button>`).join("")}
 </div>`;
}
function renderLogin(){
 document.getElementById("app").innerHTML=`<main class="wrap"><div class="card login">
   <div class="brand"><span>⚡</span> BANTY</div><h1>Customer Login</h1>
   <p style="color:var(--muted)">Google account se login karo. Purchase, files aur license keys isi account se linked rahengi.</p>
   <button class="btn google" style="width:100%;margin-top:16px" onclick="googleLogin()">Continue with Google</button>
   <div class="notice" style="margin-top:16px">Real Google OAuth ke liye backend/Firebase configuration required hai. Demo mode me button test account banata hai.</div>
 </div></main>`;
}
async function googleLogin(){
 if(CONFIG.apiBase){
   location.href=CONFIG.apiBase+CONFIG.googleLoginEndpoint;
   return;
 }
 sessionStorage.setItem("banty_user","demo@gmail.com");
 toast("Demo Google login successful");
 render();
}
function render(){
 if(!isLogged()){renderLogin();return}
 const page=window.page||"dashboard";
 let body="";
 if(page==="dashboard") body=dashboard();
 if(page==="files") body=files();
 if(page==="keys") body=keys();
 if(page==="users") body=users();
 if(page==="settings") body=settings();
 document.getElementById("app").innerHTML=shell(`<div class="hero card"><h1>${esc(db.settings.title)}</h1><p>APK / TOOL CONTROL CENTER • V1</p><div class="row"><span class="pill">Logged in: ${esc(user())}</span><button class="btn" onclick="logout()">Logout</button></div></div>${nav(page)}${body}`);
}
function dashboard(){
 const active=db.keys.filter(k=>k.status==="active").length;
 return `<section class="grid">
   <div class="stat"><small>Products</small><strong>${db.products.length}</strong></div>
   <div class="stat"><small>Active Keys</small><strong>${active}</strong></div>
   <div class="stat"><small>Users</small><strong>${db.users.length}</strong></div>
   <div class="stat"><small>Sales</small><strong>₹${db.purchases.reduce((a,p)=>a+p.amount,0)}</strong></div>
 </section>
 <div class="card"><h2>My Account</h2><div class="notice">Google account: <b>${esc(user())}</b><br>Purchased files aur generated license keys isi account me show honge.</div></div>
 <div class="card"><h2>Updates & Feedback</h2><div class="row">
   <a class="btn primary" href="${CONFIG.telegramUpdates}" target="_blank" rel="noopener">📦 Update File Channel</a>
   <a class="btn" href="${CONFIG.telegramFeedback}" target="_blank" rel="noopener">💬 Feedback Channel</a>
 </div></div>`;
}
function files(){
 return `<div class="card"><h2>Files / Products</h2><div class="products">${db.products.map(p=>`<article class="card product">
 <div><span class="pill">${p.available?"AVAILABLE":"UNAVAILABLE"}</span><h3>${esc(p.name)}</h3><p style="color:var(--muted)">${esc(p.desc)}</p><div class="price">₹${p.price}</div></div>
 <button class="btn primary" onclick="buy('${p.id}')">Buy Now</button></article>`).join("")}</div></div>
 <div class="card"><h2>My Purchases</h2>${db.purchases.filter(p=>p.user===user()).length?`<div class="list">${db.purchases.filter(p=>p.user===user()).map(p=>`<div class="item"><b>${esc(p.name)}</b><span>₹${p.amount} • ${esc(p.status)}</span>${p.status==="verified"?`<div class="row" style="margin-top:10px"><button class="btn primary" onclick="generateKey('${p.id}')">Generate Key</button><button class="btn" onclick="downloadFile('${p.id}')">Get File</button></div>`:"<div class='dangerText' style='margin-top:8px'>Payment verification pending.</div>"}</div>`).join("")}</div>`:"<p style='color:var(--muted)'>No purchases yet.</p>"}</div>`;
}
function keys(){
 const mine=db.keys.filter(k=>k.user===user());
 return `<div class="card"><h2>License Keys</h2><p style="color:var(--muted)">Verified purchase ke baad hi key generate hogi.</p>${mine.length?`<div class="list">${mine.map(k=>`<div class="item"><b>${esc(k.key)}</b><span>${esc(k.product)} • ${esc(k.status)}</span></div>`).join("")}</div>`:"<p style='color:var(--muted)'>No generated keys.</p>"}</div>`;
}
function users(){
 return `<div class="card"><h2>Account</h2><div class="item"><b>${esc(user())}</b><span>Google authenticated customer</span></div></div>
 <div class="card"><h2>Admin Users</h2>${db.users.map(u=>`<div class="item"><b>${esc(u)}</b></div>`).join("")}</div>`;
}
function settings(){
 return `<div class="card"><h2>Tool Settings</h2><label>Panel title</label><input id="panelTitle" value="${esc(db.settings.title)}">
 <label>Tool name</label><input id="toolName" value="${esc(db.settings.tool)}">
 <div class="two"><div><label>Tool status</label><select id="toolStatus"><option ${db.settings.status==="ON"?"selected":""}>ON</option><option>OFF</option></select></div><div><label>RGB effect</label><select id="rgb"><option ${db.settings.rgb==="ON"?"selected":""}>ON</option><option>OFF</option></select></div></div>
 <label>Maintenance mode</label><select id="maint"><option ${db.settings.maintenance==="OFF"?"selected":""}>OFF</option><option>ON</option></select>
 <div class="row" style="margin-top:18px"><button class="btn primary" onclick="saveSettings()">Save Settings</button><button class="btn danger" onclick="resetDemo()">Reset Demo Data</button></div>
 <p style="color:var(--muted);margin-top:18px">GitHub Pages browser-local demo sirf localStorage use karta hai. Real users, verified payments aur protected files ke liye server/database zaroori hai.</p></div>`;
}
function go(p){window.page=p;render();scrollTo({top:0,behavior:"smooth"})}
function logout(){sessionStorage.removeItem("banty_user");render()}
function saveSettings(){
 db.settings.title=document.getElementById("panelTitle").value||"⚡ BANTY ADMIN PANEL";
 db.settings.tool=document.getElementById("toolName").value||"BROTHERS TOOL";
 db.settings.status=document.getElementById("toolStatus").value;
 db.settings.rgb=document.getElementById("rgb").value;
 db.settings.maintenance=document.getElementById("maint").value;
 save();toast("Settings saved");render();
}
function resetDemo(){if(confirm("Reset demo data?")){db=structuredClone(demo);save();toast("Demo data reset");render()}}
async function buy(id){
 const p=db.products.find(x=>x.id===id); if(!p)return;
 if(CONFIG.apiBase){
   try{
    const r=await fetch(CONFIG.apiBase+CONFIG.createOrderEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({productId:id})});
    const order=await r.json();
    if(!window.Razorpay){toast("Razorpay SDK missing");return}
    new Razorpay(order).open();
   }catch(e){toast("Payment service unavailable")}
   return;
 }
 db.purchases.push({id:"pur_"+Date.now(),user:user(),productId:p.id,name:p.name,amount:p.price,status:"verified",created:new Date().toISOString()});
 save();toast("Demo purchase verified");render();
}
async function generateKey(purchaseId){
 const p=db.purchases.find(x=>x.id===purchaseId && x.user===user() && x.status==="verified");
 if(!p){toast("Verified purchase required");return}
 if(CONFIG.apiBase){
   try{
    const r=await fetch(CONFIG.apiBase+CONFIG.generateKeyEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({purchaseId})});
    const out=await r.json(); toast(out.message||"Key generated"); go("keys"); return;
   }catch(e){toast("Key service unavailable");return}
 }
 const key="BANTY-"+crypto.randomUUID().replaceAll("-","").slice(0,16).toUpperCase();
 db.keys.push({id:"key_"+Date.now(),user:user(),purchaseId,product:p.name,key,status:"active"});
 save();toast("License key generated");go("keys");
}
function downloadFile(purchaseId){
 const p=db.purchases.find(x=>x.id===purchaseId && x.user===user() && x.status==="verified");
 if(!p){toast("Verified purchase required");return}
 if(CONFIG.apiBase){location.href=CONFIG.apiBase+CONFIG.myFilesEndpoint+"?purchaseId="+encodeURIComponent(purchaseId);return}
 const blob=new Blob([`BANTY DEMO FILE\nProduct: ${p.name}\nAccount: ${user()}\n\nThis is a demo delivery placeholder. Connect a secure backend to deliver the real purchased file.`],{type:"text/plain"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=p.name.replace(/\s+/g,"_")+"_DEMO.txt";a.click();URL.revokeObjectURL(a.href);
}
render();
</script>
</body>
</html>
